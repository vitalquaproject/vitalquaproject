<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0D1B30"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>

    <!-- Warm halo behind guitar -->
    <radialGradient id="guitarHalo" cx="980" cy="315" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8A4C22" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#3A1A08" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#061018" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow top-left -->
    <radialGradient id="cyanHalo" cx="200" cy="200" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4FB3D9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#061018" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layers de fons -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyanHalo)"/>
  <rect width="1200" height="630" fill="url(#guitarHalo)"/>

  <!-- Línia accent esquerra -->
  <rect x="60" y="68" width="4" height="494" rx="2" fill="#4FB3D9" opacity="0.7"/>

  <!-- ?? ZONA TEXT (esquerra) ?? -->

  <!-- Label organitzadors -->
  <text x="82" y="115"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15" font-weight="600"
    fill="#4FB3D9" opacity="0.8" letter-spacing="3.5">
    UIC BARCELONA · ADESCI · VITALQUA PROJECT
  </text>

  <!-- Separador -->
  <line x1="82" y1="128" x2="750" y2="128" stroke="#4FB3D9" stroke-width="0.7" opacity="0.25"/>

  <!-- "Concert" -->
  <text x="82" y="258"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="126" font-weight="700"
    fill="#FFFFFF" opacity="1" letter-spacing="-2">Concert</text>

  <!-- "Benèfic" en cyan -->
  <text x="82" y="375"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="126" font-weight="700"
    fill="#4FB3D9" letter-spacing="-2">Benèfic</text>

  <!-- Línia decorativa -->
  <line x1="82" y1="400" x2="650" y2="400" stroke="#4FB3D9" stroke-width="0.7" opacity="0.20"/>

  <!-- Data i lloc -->
  <text x="82" y="454"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28" fill="#FFFFFF" opacity="0.85">
    16 Juliol · 19:00 h · UIC Barcelona
  </text>

  <!-- Subtítol solidari -->
  <text x="82" y="495"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18" fill="#A3D0E3" opacity="0.70">
    Una nit de música solidària per a 500 estudiants a Kenya
  </text>

  <!-- URL -->
  <text x="82" y="562"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16" fill="#4FB3D9" opacity="0.50" letter-spacing="0.5">
    vitalquaproject.vercel.app
  </text>

