<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 44" role="img" aria-label="Water glass">
  <title>Water Glass</title>
  <!--
    Faceted water glass - same polygon/fan technique as the drop logo.
    Colors: #4FB3D9, #D6EEF6, #A3D0E3, #2A85B3 (+ lighter air tints).
    Glass outer: top (5,6)-(27,6), bottom (8,42)-(24,42)
    Inner walls: top (6.5,8)-(25.5,8), bottom (9.5,42)-(22.5,42)
    Water level: y=19 (~65% full). Water fan centre: (16,30). Air centre: (16,13.5)
  -->
  <style>polygon { stroke-width: .4; }</style>

  <!-- Glass structure -->
  <polygon points="5,6 27,6 25.5,8 6.5,8"        fill="#A3D0E3" stroke="#A3D0E3"/>
  <polygon points="5,6 6.5,8 9.5,42 8,42"         fill="#4FB3D9" stroke="#4FB3D9"/>
  <polygon points="25.5,8 27,6 24,42 22.5,42"     fill="#D6EEF6" stroke="#D6EEF6"/>
  <polygon points="8,42 24,42 24,43.5 8,43.5"     fill="#2A85B3" stroke="#2A85B3"/>

  <!-- Air space (y=8 to y=19) - 4-triangle fan from (16,13.5) -->
  <polygon points="6.5,8 25.5,8 16,13.5"          fill="#EEF7FB" stroke="#EEF7FB"/>
  <polygon points="25.5,8 24.5,19 16,13.5"        fill="#E0F2F8" stroke="#E0F2F8"/>
  <polygon points="7.5,19 24.5,19 16,13.5"        fill="#C8E8F2" stroke="#C8E8F2"/>
  <polygon points="6.5,8 7.5,19 16,13.5"          fill="#B8DDE9" stroke="#B8DDE9"/>

  <!-- Water body (y=19 to y=42) - 8-triangle fan from (16,30) -->
  <polygon points="16,30 7.5,19 16,19"            fill="#4FB3D9" stroke="#4FB3D9"/>
  <polygon points="16,30 16,19 24.5,19"           fill="#D6EEF6" stroke="#D6EEF6"/>
  <polygon points="16,30 24.5,19 23.6,30"         fill="#D6EEF6" stroke="#D6EEF6"/>
  <polygon points="16,30 23.6,30 22.5,42"         fill="#A3D0E3" stroke="#A3D0E3"/>
  <polygon points="16,30 22.5,42 16,42"           fill="#A3D0E3" stroke="#A3D0E3"/>
  <polygon points="16,30 16,42 9.5,42"            fill="#4FB3D9" stroke="#4FB3D9"/>
  <polygon points="16,30 9.5,42 8.4,30"           fill="#2A85B3" stroke="#2A85B3"/>
  <polygon points="16,30 8.4,30 7.5,19"           fill="#2A85B3" stroke="#2A85B3"/>
</svg>
