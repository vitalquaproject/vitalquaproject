<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotos · Vitalqua Show</title>
  <meta name="description" content="Fotografies del Vitalqua Show — Concert Benèfic Vitalqua Project." />
  <meta property="og:title" content="Fotos · Vitalqua Show" />
  <meta property="og:description" content="Galeria de fotografies de la festa benèfica Vitalqua Show." />
  <meta property="og:url" content="https://vitalquaproject.vercel.app/fotos-show.html" />
  <link rel="icon" type="image/svg+xml" href="img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F9FC;
      --surface: #FFFFFF;
      --navy: #0F1A2E;
      --ink: #0F1A2E;
      --ink-soft: #3F4F6B;
      --muted: #6B7890;
      --cy-dk: #2A85B3;
      --cy-xdk: #1B5F85;
      --cy-xlt: #D6EEF6;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(79,179,217,.18), transparent 55%),
        radial-gradient(ellipse 70% 40% at 90% 0%, rgba(27,95,133,.12), transparent 50%),
        var(--bg);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--cy-xdk);
    }
    h1 {
      margin: 0 0 12px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--navy);
    }
    .lead {
      margin: 0 auto;
      max-width: 42rem;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--ink-soft);
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      padding: 48px 16px;
    }
    .spinner {
      width: 28px; height: 28px;
      margin: 0 auto 14px;
      border: 2.5px solid rgba(42,133,179,.2);
      border-top-color: var(--cy-dk);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Masonry: horitzontals i verticals sense forçar retall */
    .grid {
      column-count: 3;
      column-gap: 14px;
    }
    @media (max-width: 900px) { .grid { column-count: 2; } }
    @media (max-width: 520px) { .grid { column-count: 1; } }

    .photo {
      margin: 0 0 14px;
      break-inside: avoid;
      background: var(--surface);
      border: 1px solid var(--cy-xlt);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
    }

    .load-more-wrap {
      margin-top: 20px;
      text-align: center;
    }
    .btn-load-more {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      border: 1.5px solid rgba(27,95,133,.35);
      background: transparent;
      color: var(--cy-xdk);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms;
    }
    .btn-load-more:hover { background: rgba(42,133,179,.08); border-color: var(--cy-dk); }
    .btn-load-more:disabled { opacity: 0.5; cursor: default; }

    .actions {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 150ms ease, color 150ms ease, border-color 150ms;
    }
    .btn-primary {
      background: var(--cy-xdk);
      color: #fff;
      border: 1.5px solid var(--cy-xdk);
    }
    .btn-primary:hover { background: var(--cy-dk); border-color: var(--cy-dk); }
    .btn-secondary {
      background: transparent;
      color: var(--cy-xdk);
      border: 1.5px solid rgba(27,95,133,.35);
    }
    .btn-secondary:hover {
      background: rgba(42,133,179,.08);
      border-color: var(--cy-dk);
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Vitalqua Show</p>
      <h1>Fotos de la festa</h1>
      <p class="lead">
        Una selecció d’imatges de la jornada. Gràcies per haver-hi estat i per donar suport al projecte.
      </p>
    </header>

    <div id="status" class="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregant fotografies…</p>
    </div>

    <div class="grid" id="gallery" hidden></div>

    <div class="load-more-wrap" id="loadMoreWrap" hidden>
      <button type="button" class="btn-load-more" id="btnLoadMore">Carregar més fotos</button>
    </div>

    <div class="actions">
      <a class="btn btn-primary"
         href="https://www.migranodearena.org/reto/agua-y-educacion-para-kenia-construyendo-el-futuro-de-emorogi"
         target="_blank" rel="noopener noreferrer">
        Donar a migranodearena
      </a>
      <a class="btn btn-secondary" href="index.html">Vitalqua Web</a>
    </div>

    <footer>
      Vitalqua Project ·
      <a href="mailto:vitalquaproject@gmail.com">vitalquaproject@gmail.com</a>
    </footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyDKic5e9DAU1iw6ZOtsT1gGEEyU8WCtAXE",
      authDomain:        "vitalqua-project.firebaseapp.com",
      projectId:         "vitalqua-project",
      storageBucket:     "vitalqua-project.firebasestorage.app",
      messagingSenderId: "263061224525",
      appId:             "1:263061224525:web:9bc179545f515ffac27004",
      measurementId:     "G-QQRGPXQP38"
    };

    // Puja les imatges a aquesta carpeta de Firebase Storage (lectura pública).
    const STORAGE_FOLDER = 'show-fotos';

    const IMAGE_EXT = /\.(jpe?g|png|webp|gif|avif)$/i;

    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();

    const statusEl = document.getElementById('status');
    const galleryEl = document.getElementById('gallery');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const btnLoadMore = document.getElementById('btnLoadMore');

    // Mostra les fotos en lots per no saturar la connexió (sobretot al mòbil).
    const BATCH_SIZE = 9;
    let allFiles = [];
    let shownCount = 0;

    function setStatus(html) {
      statusEl.hidden = false;
      statusEl.innerHTML = html;
      galleryEl.hidden = true;
    }

    function renderBatch(urls, startIndex) {
      const html = urls.map((url, i) =>
        `<figure class="photo"><img src="${url}" alt="Foto ${startIndex + i + 1} del Vitalqua Show" loading="lazy" decoding="async" /></figure>`
      ).join('');
      galleryEl.insertAdjacentHTML('beforeend', html);
    }

    async function showNextBatch() {
      const nextFiles = allFiles.slice(shownCount, shownCount + BATCH_SIZE);
      if (!nextFiles.length) return;

      btnLoadMore.disabled = true;
      btnLoadMore.textContent = 'Carregant…';

      const urls = await Promise.all(nextFiles.map((item) => item.getDownloadURL()));
      renderBatch(urls, shownCount);
      shownCount += nextFiles.length;

      const remaining = allFiles.length - shownCount;
      loadMoreWrap.hidden = remaining <= 0;
      btnLoadMore.disabled = false;
      btnLoadMore.textContent = `Carregar més fotos (${remaining} restants)`;
    }

    async function loadPhotos() {
      try {
        const folderRef = storage.ref(STORAGE_FOLDER);
        const result = await folderRef.listAll();
        allFiles = result.items.filter((item) => IMAGE_EXT.test(item.name));

        if (!allFiles.length) {
          setStatus('<p>Encara no hi ha fotografies publicades. Torna-ho a provar aviat.</p>');
          return;
        }

        statusEl.hidden = true;
        galleryEl.hidden = false;
        await showNextBatch();
      } catch (err) {
        console.error('[fotos-show]', err);
        setStatus(
          '<p>No s\'han pogut carregar les fotos. Comprova que la carpeta <strong>show-fotos</strong> ' +
          'existeix a Storage i que les regles permeten lectura pública.</p>'
        );
      }
    }

    btnLoadMore.addEventListener('click', showNextBatch);
    loadPhotos();
  </script>
</body>
</html>
