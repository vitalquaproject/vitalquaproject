    <line x1="70" y1="49"  x2="90" y2="49"  stroke="#F0D898" stroke-width=".7" opacity=".5"/>
    <line x1="70" y1="61"  x2="90" y2="61"  stroke="#F0D898" stroke-width=".7" opacity=".5"/>
    <line x1="70" y1="73"  x2="90" y2="73"  stroke="#F0D898" stroke-width=".7" opacity=".5"/>
    <line x1="70" y1="85"  x2="90" y2="85"  stroke="#F0D898" stroke-width=".7" opacity=".5"/>
    <line x1="70" y1="97"  x2="90" y2="97"  stroke="#F0D898" stroke-width=".7" opacity=".5"/>
