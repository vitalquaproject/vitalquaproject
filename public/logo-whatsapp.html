<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo WhatsApp — The Vitalqua Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    @media (max-width: 540px) {
      body { justify-content: flex-start; padding-top: 10px; }
    }
    .hint {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,.35);
      letter-spacing: 0.1em;
    }

    /* ── The square card ── */
    .card {
      position: relative;
      width: 512px;
      height: 512px;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: 24px;
      background:
        radial-gradient(ellipse at 25% 25%, rgba(79,179,217,.15) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 75%, rgba(27,95,133,.20) 0%, transparent 55%),
        linear-gradient(160deg, #0A1628 0%, #07101E 60%, #0D1E38 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Animated triangle canvas — same as hero */
    .bg-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-canvas svg { width: 100%; height: 100%; display: block; }

    /* Content stack */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      width: 100%;
      padding: 0 32px;
    }

    /* Top eyebrow */
    .eyebrow {
      font-family: 'Inter Tight', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(163,208,227,.55);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(163,208,227,.22);
      max-width: 28px;
    }

    /* Concert name */
    .concert-name {
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,.6);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .concert-name em { font-style: normal; color: #fff; font-weight: 700; }

    /* Guitar — viewBox 160×340 so height = width × 2.125 */
    .guitar-wrap {
      position: relative;
      width: 88px;
      margin: 6px 0 6px;
      filter:
        drop-shadow(0 10px 28px rgba(160,110,40,0.55))
        drop-shadow(0 0 16px rgba(210,175,80,0.25));
      animation: guitar-float 5s ease-in-out infinite;
    }
    .guitar-wrap svg { width: 100%; height: auto; }
    @keyframes guitar-float {
      0%, 100% { transform: translateY(0px) rotate(-0.8deg); }
      50%       { transform: translateY(-8px) rotate(0.8deg); }
    }

    /* Tagline */
    .your-night {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      font-weight: 400;
      letter-spacing: 0.1em;
      line-height: 0.9;
      color: #D4AF37;
      text-shadow:
        0 0 8px  rgba(212,175,55,1),
        0 0 20px rgba(212,175,55,0.75),
        0 0 40px rgba(212,175,55,0.4);
    }
    .sep {
      width: 38px;
      height: 1.5px;
      background: rgba(163,213,227,.32);
      margin: 7px 0;
    }
    .their-water {
      font-family: 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 0.16em;
      line-height: 1;
      color: #A3D0E3;
    }

    /* Water drop accent */
    .drop-accent {
      margin-top: 10px;
      opacity: 0.55;
      animation: drop-pulse 2.4s ease-in-out infinite;
    }
    @keyframes drop-pulse {
      0%, 100% { transform: scale(1);    opacity: 0.45; }
      50%       { transform: scale(1.1); opacity: 0.75; }
    }

    /* Pills row */
    .pills {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(79,179,217,.1);
      border: 1px solid rgba(79,179,217,.22);
      color: #A3D0E3;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
      backdrop-filter: blur(8px);
    }
    .pill strong { color: #fff; font-weight: 600; }
    .pill svg { opacity: 0.7; flex-shrink: 0; }
  </style>

  <script>
    /* Escala la tarjeta para que quepa en pantallas pequeñas */
    function fitCard() {
      var card = document.querySelector('.card');
      if (!card) return;
      var maxSide = Math.min(window.innerWidth - 20, window.innerHeight - 72, 512);
      var scale   = maxSide / 512;
      if (scale < 1) {
        card.style.transformOrigin = 'top center';
        card.style.transform       = 'scale(' + scale.toFixed(4) + ')';
        card.style.marginBottom    = Math.round((scale - 1) * 512) + 'px';
      } else {
        card.style.transform    = '';
        card.style.marginBottom = '';
      }
    }
    fitCard();
    window.addEventListener('resize', fitCard);
  </script>

  <script>
    /* Same triangle animation as concert.html hero */
    (function () {
      const g    = document.getElementById('tris');
      const W = 160, H = 160;
      const COLS = ['rgba(79,179,217,', 'rgba(42,133,179,', 'rgba(27,95,133,', 'rgba(212,175,55,'];
      const tris = [];
      for (let i = 0; i < 22; i++) {
        const el  = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        const col = COLS[Math.floor(Math.random() * COLS.length)];
        const op  = (0.04 + Math.random() * 0.09).toFixed(2);
        el.setAttribute('fill', col + op + ')');
        const t = {
          el,
          x: Math.random() * W, y: Math.random() * H,
          r: 5 + Math.random() * 18,
          angle: Math.random() * Math.PI * 2,
          vx: (Math.random() - 0.5) * 0.06,
          vy: (Math.random() - 0.5) * 0.06,
          va: (Math.random() - 0.5) * 0.004,
        };
        tris.push(t);
        g.appendChild(el);
      }
      function pts(t) {
        const a = t.angle, r = t.r;
        const p = [0, 1, 2].map(i => {
          const a2 = a + i * Math.PI * 2 / 3;
          return (t.x + Math.cos(a2) * r).toFixed(2) + ',' + (t.y + Math.sin(a2) * r).toFixed(2);
        });
        return p.join(' ');
      }
      function tick() {
        tris.forEach(t => {
          t.x += t.vx; t.y += t.vy; t.angle += t.va;
          if (t.x < -t.r)  t.x = W + t.r;
          if (t.x > W + t.r) t.x = -t.r;
          if (t.y < -t.r)  t.y = H + t.r;
          if (t.y > H + t.r) t.y = -t.r;
          t.el.setAttribute('points', pts(t));
        });
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
