    <polygon points="90,120 80,120 102,126" fill="#D4B462"/>
    <polygon points="80,163  80,120  102,126" fill="#FAECD0"/>
    <polygon points="80,163 102,126  117,142" fill="#F0D8AA"/>
    <polygon points="80,163 117,142  123,163" fill="#DECA88"/>
