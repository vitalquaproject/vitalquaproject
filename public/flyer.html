<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flyer — Concierto Benéfico · Vitalqua Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a1628;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Flyer canvas ── */
    .flyer {
      position: relative;
      width: 600px;
      height: 850px;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 32px 80px rgba(0,0,0,.55);
    }

    /* ── Background: photo + dark tint ── */
    .flyer-bg {
      position: absolute;
      inset: 0;
      background-image: url('img/fimg.jpg');
      background-size: cover;
      background-position: center 40%;
    }
    .flyer-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        170deg,
        rgba(7,16,30,.72) 0%,
        rgba(10,22,42,.60) 50%,
        rgba(6,18,34,.75) 100%
      );
    }

    /* Water drop blobs */
    .bg-drop {
      position: absolute;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0.18;
    }
    .bg-drop--1 {
      width: 340px; height: 460px;
      top: -80px; left: -80px;
      background: radial-gradient(circle at 40% 35%, #7bd0f0, #1b8fc4);
      transform: rotate(-20deg);
    }
    .bg-drop--2 {
      width: 280px; height: 380px;
      bottom: -60px; right: -60px;
      background: radial-gradient(circle at 50% 40%, #4fb3d9, #0e5a7e);
      transform: rotate(18deg);
      opacity: 0.22;
    }
    .bg-drop--3 {
      width: 180px; height: 240px;
      top: 180px; right: 20px;
      background: radial-gradient(circle at 45% 30%, #9de0f8, #2a85b3);
      transform: rotate(-10deg);
      opacity: 0.14;
    }
    .bg-drop--4 {
      width: 130px; height: 180px;
      bottom: 200px; left: 30px;
      background: radial-gradient(circle at 45% 30%, #a3d0e3, #1b5f85);
      transform: rotate(25deg);
      opacity: 0.16;
    }

    /* Ripple circles */
    .bg-ripple {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(79,179,217,.15);
    }
    .bg-ripple--1 { width: 500px; height: 500px; bottom: -150px; right: -150px; }
    .bg-ripple--2 { width: 360px; height: 360px; bottom: -80px; right: -80px; }
    .bg-ripple--3 { width: 220px; height: 220px; top: -60px; left: -60px; }

    /* Floating sparkles */
    .sparkle {
      position: absolute;
      opacity: 0;
      animation: twinkle 4s ease-in-out infinite;
    }
    .sparkle::before, .sparkle::after {
      content: '';
      position: absolute;
      background: #a3d0e3;
      border-radius: 2px;
    }
    .sparkle::before { width: 2px; height: 12px; top: 0; left: 5px; }
    .sparkle::after  { width: 12px; height: 2px; top: 5px; left: 0; }
    .sparkle--1 { top: 80px; left: 60px; animation-delay: 0s; }
    .sparkle--2 { top: 160px; right: 80px; animation-delay: 1.2s; }
    .sparkle--3 { bottom: 120px; left: 80px; animation-delay: 2.4s; }
    .sparkle--4 { bottom: 240px; right: 60px; animation-delay: 0.7s; }
    .sparkle--5 { top: 360px; left: 30px; animation-delay: 3s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.6); }
      50%       { opacity: .7; transform: scale(1); }
    }

    /* ── Glass panel ── */
    .panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 4px;
      padding: 40px 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow:
        0 2px 0 rgba(255,255,255,0.12) inset,
        0 24px 64px rgba(0,0,0,.30);
    }

    /* Org logos — no box, white silhouettes */
    .orgs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 26px;
    }
    .org-logo {
      height: 38px;
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
      opacity: .85;
    }
    .org-logo--adesci {
      height: 30px;
    }
    .org-sep {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(163,208,227,.5);
      flex-shrink: 0;
    }
    /* Vitalqua text logo — mirrors show.html header */
    .org-vq {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .org-vq-mark {
      height: 26px;
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
      opacity: .85;
      flex-shrink: 0;
    }
    .org-vq-text {
      font-family: 'Inter Tight', 'Inter', sans-serif;
      font-weight: 600;
      font-size: .88rem;
      letter-spacing: -0.02em;
      color: rgba(255,255,255,.85);
      white-space: nowrap;
    }

    /* Title — unified Bebas Neue block */
    .title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      line-height: 1;
    }
    .title-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 6rem;
      letter-spacing: .06em;
      color: #ffffff;
      text-shadow: 0 2px 24px rgba(79,179,217,.28);
      line-height: .92;
    }
    .title-accent {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.4rem;
      letter-spacing: .22em;
      color: #4FB3D9;
      line-height: 1;
      text-shadow: 0 0 28px rgba(79,179,217,.45);
    }

    /* Date badge */
    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0F1A2E;
      color: #fff;
      font-family: 'Inter Tight', 'Inter', sans-serif;
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .08em;
      padding: 7px 18px;
      border-radius: 3px;
      margin-bottom: 14px;
    }
    .date-badge-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #4FB3D9;
      flex-shrink: 0;
    }

    /* Time */
    .time-line {
      font-family: 'Inter', sans-serif;
      font-size: .78rem;
      letter-spacing: .12em;
      color: rgba(163,208,227,.85);
      margin-bottom: 22px;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.18);
      margin: 4px 0 20px;
    }

    /* Cause line */
    .cause {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.45;
      color: rgba(255,255,255,.88);
      margin-bottom: 18px;
    }

    /* Price row */
    .price-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 4px;
    }
    .price-main {
      font-family: 'Inter', sans-serif;
      font-size: .78rem;
      color: rgba(255,255,255,.82);
    }
    .price-impact {
      font-family: 'Inter', sans-serif;
      font-size: .72rem;
      color: rgba(163,208,227,.75);
    }

    .divider-sm {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.13);
      margin: 20px 0 22px;
    }

    /* Icon row */
    .icon-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }
    .icon-circle {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #0F1A2E;
      border: 1px solid rgba(79,179,217,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-circle svg {
      display: block;
    }

    /* Venue */
    .venue {
      font-family: 'Inter', sans-serif;
      font-size: .74rem;
      line-height: 1.7;
      color: rgba(255,255,255,.72);
      letter-spacing: .02em;
    }
    .venue strong {
      font-weight: 600;
      color: rgba(255,255,255,.9);
    }

    /* ── Vitalqua watermark logo at bottom of flyer ── */
    .flyer-logo {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: .55;
    }
    .flyer-logo-drop {
      width: 18px; height: 24px;
    }
    .flyer-logo-text {
      font-family: 'Inter Tight', 'Inter', sans-serif;
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #a3d0e3;
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; }
      .flyer { box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="flyer">

  <!-- Background -->
  <div class="flyer-bg"></div>

  <!-- Water drop shapes -->
  <div class="bg-drop bg-drop--1"></div>
  <div class="bg-drop bg-drop--2"></div>
  <div class="bg-drop bg-drop--3"></div>
  <div class="bg-drop bg-drop--4"></div>

  <!-- Ripple circles -->
  <div class="bg-ripple bg-ripple--1"></div>
  <div class="bg-ripple bg-ripple--2"></div>
  <div class="bg-ripple bg-ripple--3"></div>

  <!-- Sparkles -->
  <div class="sparkle sparkle--1"></div>
  <div class="sparkle sparkle--2"></div>
  <div class="sparkle sparkle--3"></div>
  <div class="sparkle sparkle--4"></div>
  <div class="sparkle sparkle--5"></div>

  <!-- Large decorative water drop SVG top-right -->
  <svg style="position:absolute;top:-30px;right:-30px;opacity:.12;pointer-events:none"
       width="260" height="360" viewBox="0 0 220 310" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="dg1" cx="42%" cy="35%" r="60%">
        <stop offset="0%"   stop-color="#9ED8F0"/>
        <stop offset="50%"  stop-color="#4FB3D9"/>
        <stop offset="100%" stop-color="#1B6FA0"/>
      </radialGradient>
    </defs>
    <path d="M110 14 C110 14 36 110 36 178 a74 74 0 0 0 148 0 C184 110 110 14 110 14 Z" fill="url(#dg1)"/>
    <path d="M110 14 L70 130 L110 175" fill="rgba(255,255,255,0.14)"/>
    <path d="M70 130 L110 175 L110 252" fill="rgba(255,255,255,0.07)"/>
    <ellipse cx="85" cy="140" rx="18" ry="32" fill="white" opacity="0.22" transform="rotate(-20 85 140)"/>
  </svg>

  <!-- Small drop bottom-left -->
  <svg style="position:absolute;bottom:-20px;left:-20px;opacity:.10;pointer-events:none"
       width="160" height="220" viewBox="0 0 220 310" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M110 14 C110 14 36 110 36 178 a74 74 0 0 0 148 0 C184 110 110 14 110 14 Z"
          fill="#4FB3D9"/>
    <path d="M110 14 L70 130 L110 175" fill="rgba(255,255,255,0.2)"/>
  </svg>

  <!-- Glass panel -->
  <div class="panel">

    <!-- Org logos (no box) -->
    <div class="orgs">
      <img src="/img/uic_logo.png" alt="UIC Barcelona" class="org-logo" />
      <div class="org-sep"></div>
      <img src="/img/adesci.png" alt="ADESCI" class="org-logo org-logo--adesci" />
      <div class="org-sep"></div>
      <span class="org-vq">
        <img src="/img/logo.svg" alt="" class="org-vq-mark" />
        <span class="org-vq-text">Vitalqua Project</span>
      </span>
    </div>

    <!-- Title — unified block -->
    <div class="title-block">
      <span class="title-main">CONCIERTO</span>
      <span class="title-accent">BENÉFICO</span>
    </div>

    <!-- Date badge -->
    <div class="date-badge">
      <div class="date-badge-dot"></div>
      16 JULIO · 2025
      <div class="date-badge-dot"></div>
    </div>

    <!-- Time -->
    <div class="time-line">19:00 – 22:30</div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Cause -->
    <p class="cause">
      Una noche de música solidaria<br>
      para llevar agua limpia a<br>
      500 estudiantes en Kenia
    </p>

    <!-- Price -->
    <div class="price-row">
      <span class="price-main">Entrada: desde <strong style="color:#fff">10&nbsp;€</strong></span>
      <span class="price-impact">20&nbsp;€ = agua para 1 estudiante durante 20 años</span>
    </div>

    <!-- Divider -->
    <div class="divider-sm"></div>

    <!-- Icon row: drop · music · heart -->
    <div class="icon-row">
      <!-- Water drop -->
      <div class="icon-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="#4FB3D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0C19 10 12 2 12 2z"/>
        </svg>
      </div>
      <!-- Music note -->
      <div class="icon-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="#4FB3D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <!-- Heart / solidarity -->
      <div class="icon-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="#4FB3D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
    </div>

    <!-- Venue -->
    <div class="venue">
      <strong>UIC Barcelona</strong><br>
      Immaculada, 22 · Barcelona
    </div>

  </div><!-- /panel -->

  <!-- Bottom watermark -->
  <div class="flyer-logo">
    <svg class="flyer-logo-drop" viewBox="0 0 220 310" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M110 14 C110 14 36 110 36 178 a74 74 0 0 0 148 0 C184 110 110 14 110 14 Z"
            fill="#4FB3D9" opacity=".9"/>
      <path d="M110 14 L70 130 L110 175" fill="rgba(255,255,255,0.22)"/>
      <ellipse cx="85" cy="130" rx="14" ry="26" fill="white" opacity="0.28" transform="rotate(-20 85 130)"/>
    </svg>
    <span class="flyer-logo-text">Vitalqua Project</span>
  </div>

</div><!-- /flyer -->

</body>
</html>
